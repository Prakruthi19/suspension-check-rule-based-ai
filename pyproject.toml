[project]
name = "suspension-check-rule-based-ai"
version = "0.2.0a1"
description = "An explainable, unit-tested rules engine for school discipline due process (Illinois and federal IDEA / Section 504)."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Prakruthi Koteshwar" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
]
dependencies = [
    "pydantic>=2.6",
    "python-dateutil>=2.9",
    "jinja2>=3.1",
    "python-docx>=1.1",
]

[project.optional-dependencies]
# Redaction on ingest: Presidio with the small English spaCy model.
redact = [
    "presidio-analyzer>=2.2.354",
    "presidio-anonymizer>=2.2.354",
    "en-core-web-sm",
]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "suspension-check-rule-based-ai[redact]",
]

[project.scripts]
suspension-check = "suspension_check.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "pre-commit>=3.7",
    "pip-audit>=2.7",
    "faker>=25",
    "openpyxl>=3.1",
    "httpx>=0.27",
]

[tool.uv.sources]
# spaCy models are not on PyPI. Before a PyPI release this needs a different
# install path (see DECISIONS.md, 2026-09-30).
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/suspension_check"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.coverage.run]
source = ["suspension_check"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017"]
